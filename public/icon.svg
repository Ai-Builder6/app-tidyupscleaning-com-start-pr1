<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Book My Cleaning / Tidyups Signature Electric Brand Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a14"/>
      <stop offset="100%" stop-color="#1e1329"/>
    </linearGradient>

    <!-- Coral to Fuchsia to Royal Violet Sparkle Flare -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7B54" />
      <stop offset="45%" stop-color="#ec4899" />
      <stop offset="75%" stop-color="#ef3ecf" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Deep Velvet Charcoal Squircle Icon Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="140" fill="#ec4899" opacity="0.16" filter="blur(30px)"/>

  <!-- Book My Cleaning Signature 4-Pointed Starburst Motif -->
  <g transform="translate(256, 256) scale(1.4) translate(-100, -100)">
    <!-- Primary Flare -->
    <path d="M100 20 C100 68 68 100 20 100 C68 100 100 132 100 180 C100 132 132 100 180 100 C132 100 100 68 100 20 Z" fill="url(#brandGrad)"/>
    
    <!-- Crisp Central Inner Clean Core -->
    <path d="M100 52 C100 80 80 100 52 100 C80 100 100 120 100 148 C100 120 120 100 148 100 C120 100 100 80 100 52 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Playful Sparkle Accents -->
    <circle cx="152" cy="48" r="14" fill="#FF7B54" opacity="0.9"/>
    <circle cx="48" cy="152" r="11" fill="#ec4899" opacity="0.85"/>
    <circle cx="154" cy="154" r="9" fill="#a855f7" opacity="0.8"/>
    <circle cx="46" cy="46" r="7" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
